name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests-backend:
    name: Unit + Integration Tests (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run backend tests with coverage
        run: npm --workspace=backend run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  unit-tests-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run frontend tests with coverage
        run: npm --workspace=frontend run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hmservice_owner
          POSTGRES_PASSWORD: owner_test_pw
          POSTGRES_DB: timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmservice_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_OWNER: postgres://hmservice_owner:owner_test_pw@localhost:5432/timetable
      DATABASE_URL: postgres://hmservice_app:app_test_pw@localhost:5432/timetable
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Initialize database (extensions, roles, functions)
        run: |
          PGPASSWORD=owner_test_pw psql -h localhost -U hmservice_owner -d timetable -f backend/src/db/init/01-extensions.sql
          # 02-roles.sql nutzt current_setting('app.app_password') — wir patchen den Wert für CI.
          # Gleiches Muster wie backend/tests/helpers/db.ts.
          sed "s|current_setting('app.app_password', true)|'app_test_pw'|g" backend/src/db/init/02-roles.sql \
            | PGPASSWORD=owner_test_pw psql -h localhost -U hmservice_owner -d timetable
          PGPASSWORD=owner_test_pw psql -h localhost -U hmservice_owner -d timetable -f backend/src/db/init/03-functions.sql
      - name: Apply migrations
        run: npm --workspace=backend exec tsx src/db/migrate.ts
      - name: Apply pilot seed (ELE-202)
        run: |
          PGPASSWORD=owner_test_pw psql -h localhost -U hmservice_owner -d timetable -f backend/src/db/migrations/0009_pilot_wave1_seed.sql
      - name: Set test-known passwords on pilot users (CI only)
        run: node backend/scripts/seed-test-credentials.mjs
      - name: Install Playwright browsers
        run: npm --workspace=e2e exec -- playwright install --with-deps chromium webkit
      - name: Start backend + run E2E tests
        # GitHub-Actions killt Background-Prozesse zwischen `run:`-Steps.
        # Daher Backend + Health-Poll + Playwright in einer einzigen Shell.
        run: |
          set -e
          LOG_FILE="$PWD/backend.log"
          # Backend im Hintergrund. Subshell wegen cwd-Wechsel, Log in repo root.
          (cd backend && npx tsx src/server.ts) > "$LOG_FILE" 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          # Health-Poll mit hartem Fail nach 60s
          echo "Warte auf Backend (max 60s)..."
          BACKEND_UP=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend up nach ${i}s"
              BACKEND_UP=true
              break
            fi
            sleep 1
          done

          if [ "$BACKEND_UP" != "true" ]; then
            echo "FEHLER: Backend kam nach 60s nicht hoch"
            echo "--- backend.log ---"
            cat "$LOG_FILE" || true
            exit 1
          fi

          # Sanity: einmal Login probieren, damit wir sehen ob Auth funktioniert
          echo "Test-Login-Probe..."
          curl -sS -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pilot.local","password":"ChangeMe123!"}' \
            | head -c 200
          echo ""

          # Playwright (set +e damit Cleanup garantiert)
          set +e
          npm --workspace=e2e run test
          E2E_EXIT=$?
          set -e

          kill $BACKEND_PID 2>/dev/null || true
          echo "--- Backend log (letzte 50 Zeilen) ---"
          tail -50 "$LOG_FILE" || true

          exit $E2E_EXIT
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-log
          path: backend.log
          retention-days: 7
