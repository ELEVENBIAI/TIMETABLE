services:
  postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmservice_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner_dev_pw}
      POSTGRES_DB: timetable
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - timetable-pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hmservice_owner -d timetable']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timetable-pgdata:
